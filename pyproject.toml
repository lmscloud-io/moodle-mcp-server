[project]
name = "moodle-mcp-server"
version = "1.0.2"
description = "MCP (Model Context Protocol) server for Moodle LMS integration"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    {name = "Marina Glancy", email = "marina.glancy@gmail.com"}
]
keywords = ["mcp", "moodle", "lms", "model-context-protocol", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3,<4",
    "requests>=2.32.5,<3",
]

[project.urls]
Homepage = "https://lmscloud.io/products/moodle-mcp/"
Repository = "https://github.com/lmscloud-io/moodle-mcp-server"
Issues = "https://github.com/lmscloud-io/moodle-mcp-server/issues"

[project.scripts]
moodle-mcp-server = "moodle_mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
